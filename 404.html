<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>404 - Không Tìm Thấy Trang | Thắng Nhảy Dây</title>
  <meta name="description" content="Trang bạn tìm kiếm không tồn tại hoặc đã được thay đổi. Quay lại trang chủ Thắng Nhảy Dây nhé!">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0e14">

  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">

  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      position: relative;
      z-index: 1;
    }

    .error-code-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--accent-amber);
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .error-hero-icon {
      font-size: 4rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 16px rgba(245, 158, 11, 0.4));
      animation: floatJump 2.5s ease-in-out infinite;
    }

    @keyframes floatJump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .error-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      max-width: 380px;
      margin: 0 auto 28px;
      line-height: 1.5;
    }

    .error-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn-home-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--accent-amber), #d97706);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
      transition: all var(--transition-fast);
    }

    .btn-home-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(245, 158, 11, 0.45);
      filter: brightness(1.08);
    }

    .btn-home-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      transition: all var(--transition-fast);
    }

    .btn-home-secondary:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
    }
  </style>
</head>
<body>
  <!-- Ambient background glow effects -->
  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>

  <main class="app-container error-container">
    <div class="avatar-wrapper" style="margin-bottom: 20px;">
      <div class="avatar-ring"></div>
      <img src="images/avatar.jpg" alt="Ảnh đại diện Thắng Nhảy Dây" class="avatar-img" width="88" height="88">
      <div class="avatar-badge">🔥</div>
    </div>

    <div class="error-code-badge">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span>LỖI 404</span>
    </div>

    <div class="error-hero-icon">🪢💨</div>

    <h1 class="error-title">Trang Này Đang Bị Lỡ Nhịp!</h1>
    <p class="error-desc">
      Đường dẫn bạn vừa truy cập không tồn tại hoặc đã được chuyển vị trí. Hãy quay về trang chủ để xem đồ tập &amp; bài tập mới nhất nhé!
    </p>

    <div class="error-actions">
      <a href="/" class="btn-home-primary" title="Về trang chủ Thắng Nhảy Dây">
        <i class="fa-solid fa-house"></i>
        <span>VỀ TRANG CHỦ</span>
      </a>
      <a href="https://www.tiktok.com/@thangnhayday" target="_blank" rel="noopener noreferrer" class="btn-home-secondary" title="Xem TikTok Thắng Nhảy Dây">
        <i class="fab fa-tiktok"></i>
        <span>Ghé Kênh TikTok</span>
      </a>
    </div>

    <footer class="app-footer" style="margin-top: 40px; padding-top: 20px;">
      <p class="footer-copyright">
        © 2026 <strong>Thắng Nhảy Dây</strong> • <a href="/">thangnhayday.com</a>
      </p>
    </footer>
  </main>
</body>
</html>
